<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3E5B6C">
  <meta name="description" content="IPA Group | MindMap as a Skill — hành trình học và thực hành MindMap tương tác.">
  <title>MindMap trong công việc — IPA Group</title>
  <link rel="icon" type="image/png" href="assets/logos/ipa-primary.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Bỏ qua menu</a>
  <div id="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><button class="brand-home" type="button" data-global-action="open-home" aria-label="Về Trang chủ"><img src="assets/logos/ipa-white.png" alt="IPA Group — về Trang chủ" class="brand-logo"></button><strong>MindMap <em>trong công việc</em></strong><small>Từ tư duy đến thực hành</small></div>
      <div class="sidebar-label">HÀNH TRÌNH HỌC</div>
      <nav id="side-nav" aria-label="Điều hướng bài học"></nav>
      <div class="sidebar-bottom"><strong>Học để ứng dụng</strong><small>Mỗi sơ đồ, một bước tiến trong công việc.</small><button class="sidebar-reset" id="reset-progress">Đặt lại tiến độ</button></div>
    </aside>
    <div class="app-main">
      <header class="topbar"><button type="button" id="desktop-sidebar-toggle" class="sidebar-desktop-toggle" data-action="toggle-sidebar" aria-label="Ẩn thanh menu" aria-controls="sidebar" aria-expanded="true">☰</button><button id="menu-toggle" class="icon-btn mobile-only" aria-label="Mở menu" aria-expanded="false" aria-controls="sidebar">☰</button><button class="back-link" data-global-action="back" hidden>← <span>Quay lại trang trước</span></button><nav class="breadcrumb" id="breadcrumb" aria-label="Đường dẫn trang"></nav><div class="top-actions"><div id="journey-progress" class="journey-progress" role="progressbar" aria-valuemin="0" aria-valuemax="3" aria-label="Tiến độ học phần"></div><span class="save-hint" id="save-indicator">● Tiến độ trên thiết bị</span></div></header>
      <main id="main" tabindex="-1"><div id="screen" class="page-enter"></div></main>
      <footer class="app-footer"><span>IPA GROUP · MINDMAP LEARNING EXPERIENCE</span><span>Tư duy rõ ràng · Thực hành mỗi ngày</span></footer>
    </div>
  </div>
  <button id="menu-scrim" class="menu-scrim" aria-label="Đóng menu" hidden></button>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="map-dialog" class="map-dialog" aria-labelledby="map-dialog-title"><div class="dialog-header"><strong id="map-dialog-title">Khám phá MindMap</strong><button class="outline small" data-global-action="close-map">Đóng sơ đồ ✕</button></div><div id="expanded-map"></div></dialog>
  <dialog id="media-dialog" class="media-dialog" aria-labelledby="media-title"><div class="dialog-header"><strong id="media-title">Phóng to minh họa</strong><button class="outline small" data-global-action="close-media">Đóng ảnh ✕</button></div><div class="media-dialog-body"><img id="media-image" src="" alt=""></div></dialog>
  <script src="js/content.js"></script>
  <script src="js/gitmind-chapters.js"></script>
  <script src="js/quiz-module1.js"></script>
  <script src="js/gitmind-overview.js"></script>
  <script src="js/learning-maps.js"></script>
  <script src="js/gamification.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
